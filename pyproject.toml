[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-computer-use"
version = "0.1.0"
description = "Interface.ai take-home: UI discovery, capabilities and deterministic replay"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "openai>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
interface-cu = "interface_cu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interface_cu = ["*.js", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: local Chromium integration (no model calls)"]
